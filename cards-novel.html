<!-- Book Card 1 -->
<div class="col-sm-6 col-md-4 col-lg-3 book-item" data-category="novel">
    <div class="card border-0 shadow-sm h-100 rounded-4 overflow-hidden">
        <div class="position-relative overflow-hidden" style="height: 220px;">
            <img src="buku/bigfour.avif" class="position-absolute w-100 h-100" style="object-fit: cover; filter: blur(20px); transform: scale(1.1);">
            <div class="position-relative w-100 h-100 d-flex align-items-center justify-content-center">
                <img src="buku/bigfour.avif" style="height: 85%; object-fit: contain;">
            </div>
        </div>
        <div class="card-body">
            <span class="badge bg-warning text-dark mb-2">Fiksi</span>
            <h5 class="card-title fw-bold">The Big Four</h5>
            <p class="card-text text-secondary small">Agatha Christie</p>
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-primary fw-bold">Tersedia</span>
            </div>
        </div>
    </div>
</div>
