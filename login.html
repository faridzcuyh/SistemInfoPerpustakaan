<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <title>Login - LibraTech</title>
</head>

<body class="bg-light">

    <div class="bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4 shadow-sm">
        <div class="container">
            <h1 class="fw-bold display-5 mb-0 text-uppercase tracking-wide">LibraTech</h1>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand p-0">
                <img src="logo.ico" alt="Logo" style="max-width: 45px; filter: brightness(0) invert(1);">
            </a>
            <ul class="navbar-nav ms-auto gap-2">
                <li class="nav-item">
                    <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="register.html">Register</a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="bg-white py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                        <h4 class="fw-bold mb-4">Login</h4>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg fw-semibold w-100 rounded-pill">Masuk</button>

                            <div id="loginMsg" class="mt-3 text-danger" aria-live="polite"></div>

                            <div class="mt-3">
                                <p class="text-secondary mb-0">Belum punya akun? <a href="register.html" class="fw-semibold">Daftar</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = loginUser(username, password);
            const msg = document.getElementById('loginMsg');

            if (!res.ok) {
                msg.textContent = res.message || 'Login gagal.';
                return;
            }

            const next = getNextUrl();
            window.location.href = next;
        });
    </script>
</body>

</html>
