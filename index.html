<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <title>LibraTech - Perpustakaan Digital</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <!-- Header -->
    <div class="bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4 shadow-sm">
      <div class="container">
        <h1 class="fw-bold display-5 mb-0 text-uppercase tracking-wide">LibraTech</h1>
      </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a href="index.html" class="navbar-brand p-0">
          <img src="logo.ico" alt="Logo" style="max-width: 45px; filter: brightness(0) invert(1)" />
        </a>
        <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-2">
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="buku.html">Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="pinjam.html">Pinjam</a>
            </li>
            <li class="nav-item" id="navLoginItem">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="login.html">Login</a>
            </li>
            <li class="nav-item" id="navRegisterItem">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="register.html">Daftar</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Baris 1: Hero -->
    <section class="bg-white py-5">
      <div class="container">
        <div class="hero-section d-flex align-items-center justify-content-center text-center position-relative rounded-4 overflow-hidden">
          <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>
          <div class="position-relative z-1 px-3">
            <h1 class="text-white display-1 fw-bold animate-fade">Selamat Datang</h1>
          </div>
        </div>
      </div>
    </section>

    <!-- Baris 2: 2 Kolom - Kiri 1 carousel, Kanan 2 carousel -->
    <section class="bg-white py-5">
      <div class="container">
        <div class="row g-4">
          <!-- Kolom Kiri: 1 Carousel -->
          <div class="col-lg-6">
            <div id="carouselKiri" class="carousel slide carousel-custom h-100" data-bs-ride="carousel" data-bs-interval="3000">
              <div class="carousel-inner rounded-4 shadow-lg overflow-hidden position-relative">
                <div class="carousel-item active carousel-img-item">
                  <img src="JElajahi 100++ buku.jpg" class="carousel-img" />
                </div>
                <div class="carousel-item carousel-img-item">
                  <img src="baca 100++ sepuasnya.jpg" class="carousel-img" />
                </div>
              </div>
            </div>
          </div>

          <!-- Kolom Kanan: 2 Carousel Vertikal -->
          <div class="col-lg-6 d-flex flex-column gap-4">
            <!-- Carousel Kanan Atas -->
            <div id="carouselKananAtas" class="carousel slide carousel-custom" data-bs-ride="carousel" data-bs-interval="3000">
              <div class="carousel-inner rounded-4 shadow-lg overflow-hidden">
                <div class="carousel-item active carousel-img-item">
                  <img src="Pelayanan Premium.jpg" class="carousel-img" />
                </div>
                <div class="carousel-item carousel-img-item">
                  <img src="koleksi.png" class="carousel-img" />
                </div>
              </div>
            </div>

            <!-- Carousel Kanan Bawah -->
            <div id="carouselKananBawah" class="carousel slide carousel-custom" data-bs-ride="carousel" data-bs-interval="3000">
              <div class="carousel-inner rounded-4 shadow-lg overflow-hidden">
                <div class="carousel-item active carousel-img-item">
                  <img src="koleksi.png" class="carousel-img" />
                </div>
                <div class="carousel-item carousel-img-item">
                  <img src="Pelayanan Premium.jpg" class="carousel-img" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const session = getCurrentUser();
        if (session && session.username) {
          const loginItem = document.getElementById('navLoginItem');
          const registerItem = document.getElementById('navRegisterItem');
          if (loginItem) loginItem.remove();
          if (registerItem) registerItem.remove();

          const ul = document.querySelector('.navbar-nav');
          if (ul) {
            const li = document.createElement('li');
            li.className = 'nav-item';
            li.innerHTML = '<span class="nav-link text-white fw-semibold px-3 rounded-pill d-flex align-items-center gap-2" style="cursor: default;"><span class="text-warning" style="font-weight: 700;">Hi, ' + session.username + '</span></span>';
            ul.appendChild(li);

            const li2 = document.createElement('li');
            li2.className = 'nav-item';
            li2.innerHTML = '<button id="logoutBtn" class="nav-link btn btn-outline-light text-white fw-semibold px-3 rounded-pill" type="button">Logout</button>';
            ul.appendChild(li2);

            document.getElementById('logoutBtn').addEventListener('click', () => {
              logout();
              window.location.href = 'login.html';
            });
          }
        }
      });
    </script>
  </body>
</html>
