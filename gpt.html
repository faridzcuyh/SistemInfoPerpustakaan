<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Bootstrap Layout</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}

/* Header Judul */
.top-title{
    padding:20px;
    text-align:center;
    border-bottom:2px solid #333;
    background:#fff;
}

.top-title h1{
    font-weight:bold;
    margin:0;
}

/* Navbar */
.navbar-custom{
    border-bottom:2px solid #333;
    background:#fff;
}

/* Hero */
.hero{
    height:240px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-bottom:2px solid #333;

    /* Ganti URL gambar sesuai kebutuhan */
    background:url('https://picsum.photos/1200/500') center/cover no-repeat;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,0.55);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h2{
    margin:0;
}

.hero h3{
    font-weight:bold;
}

/* Carousel Box */
.carousel-section{
    padding:60px 0;
    border-bottom:2px solid #333;
    background:white;
}

.carousel-box{
    max-width:700px;
    margin:auto;
    border:3px solid #222;
    padding:50px;
}

/* Footer */
footer{
    padding:25px;
    text-align:center;
    font-size:35px;
    background:#eee;
}

/* biar mirip ada ruang kosong kanan kiri */
.main-wrapper{
    border-left:1px solid #888;
    border-right:1px solid #888;
    background:white;
}
</style>
</head>
<body>

<!-- JUDUL -->
<header class="top-title">
    <h1>JUDUL</h1>
</header>


<!-- NAVBAR -->
<nav class="navbar navbar-custom">
<div class="container-fluid">
    <span class="navbar-brand mb-0 h1">NavBar</span>

    <button class="navbar-toggler border-0" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>
</div>

<div class="collapse" id="menu">
<div class="p-3 border-top">
    <a href="#" class="d-block mb-2">Home</a>
    <a href="#" class="d-block mb-2">About</a>
    <a href="#" class="d-block">Contact</a>
</div>
</div>
</nav>


<div class="container main-wrapper">

<!-- HERO -->
<section class="hero">
<div class="hero-content">
    <h2>Background Gambar</h2>
    <h3>Selamat Datang</h3>
</div>
</section>


<!-- CAROUSEL -->
<section class="carousel-section">

<div id="mySlider" class="carousel slide carousel-box" data-bs-ride="carousel">

<div class="carousel-inner text-center">

<div class="carousel-item active">
    <h3>Carousel 1</h3>
    <p>Isi slide pertama</p>
</div>

<div class="carousel-item">
    <h3>Carousel 2</h3>
    <p>Isi slide kedua</p>
</div>

<div class="carousel-item">
    <h3>Carousel 3</h3>
    <p>Isi slide ketiga</p>
</div>

</div>

<button class="carousel-control-prev" type="button"
data-bs-target="#mySlider"
data-bs-slide="prev">

<span class="carousel-control-prev-icon bg-dark rounded-circle p-3"></span>

</button>

<button class="carousel-control-next" type="button"
data-bs-target="#mySlider"
data-bs-slide="next">

<span class="carousel-control-next-icon bg-dark rounded-circle p-3"></span>

</button>

</div>

</section>

</div>


<footer>
Footer
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
