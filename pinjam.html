<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <title>Pinjam - LibraTech</title>
</head>

<body class="bg-light">

    <!-- Header -->
    <div class="bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4 shadow-sm">
        <div class="container">
            <h1 class="fw-bold display-5 mb-0 text-uppercase tracking-wide">LibraTech</h1>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand p-0">
                <img src="logo.ico" alt="Logo" style="max-width: 45px; filter: brightness(0) invert(1);">
            </a>
            <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="buku.html">Buku</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn btn-warning text-dark fw-semibold px-3 rounded-pill"
                            aria-current="page" href="pinjam.html">Pinjam</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Judul -->
    <section class="bg-white py-4 border-bottom">
        <div class="container">
            <h2 class="fw-bold text-dark mb-0">📋 Peminjaman Buku</h2>
            <p class="text-secondary mt-2 mb-0">Ajukan peminjaman buku perpustakaan digital</p>
        </div>
    </section>

    <!-- Form Peminjaman -->
    <section class="bg-white py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                        <h4 class="fw-bold mb-4">Formulir Peminjaman</h4>
                        <form id="pinjamForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nama Lengkap</label>
                                    <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nomor Anggota</label>
                                    <input type="text" id="nomorAnggota" class="form-control" placeholder="Masukkan nomor anggota" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Judul Buku</label>
                                    <input type="text" id="judulBuku" class="form-control" placeholder="Masukkan judul buku" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Kategori</label>
                                    <select id="kategori" class="form-select" required>
                                        <option value="">Pilih kategori</option>
                                        <option>Komik</option>
                                        <option>Novel</option>
                                        <option>Ensiklopedia</option>
                                        <option>Sejarah</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Tanggal Pinjam</label>
                                    <input type="date" id="tglPinjam" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Tanggal Kembali</label>
                                    <input type="date" id="tglKembali" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Catatan</label>
                                    <textarea id="catatan" class="form-control" rows="3" placeholder="Tambahkan catatan (opsional)"></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg fw-semibold w-100 rounded-pill">Ajukan Peminjaman</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Daftar Peminjaman -->
    <section class="bg-white py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="fw-bold mb-0">📋 Data Peminjaman</h4>
                            <button id="hapusSemuaBtn" class="btn btn-outline-danger rounded-pill btn-sm px-3">Hapus Semua</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>No</th>
                                        <th>Nama</th>
                                        <th>No. Anggota</th>
                                        <th>Judul Buku</th>
                                        <th>Kategori</th>
                                        <th>Tgl Pinjam</th>
                                        <th>Tgl Kembali</th>
                                        <th>Catatan</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="dataTableBody">
                                    <!-- Data will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                        <p id="emptyMessage" class="text-center text-secondary mt-4 mb-0">Belum ada data peminjaman.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load data from localStorage
        function getPeminjaman() {
            return JSON.parse(localStorage.getItem('peminjaman')) || [];
        }

        // Save data to localStorage
        function savePeminjaman(data) {
            localStorage.setItem('peminjaman', JSON.stringify(data));
        }

        // Render table
        function renderTable() {
            const data = getPeminjaman();
            const tbody = document.getElementById('dataTableBody');
            const emptyMsg = document.getElementById('emptyMessage');

            if (data.length === 0) {
                tbody.innerHTML = '';
                emptyMsg.style.display = '';
                return;
            }
            emptyMsg.style.display = 'none';

            tbody.innerHTML = data.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.nama}</td>
                    <td>${item.nomorAnggota}</td>
                    <td>${item.judulBuku}</td>
                    <td><span class="badge bg-secondary">${item.kategori}</span></td>
                    <td>${item.tglPinjam}</td>
                    <td>${item.tglKembali}</td>
                    <td>${item.catatan || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger rounded-pill hapus-btn" data-index="${index}">Hapus</button>
                    </td>
                </tr>
            `).join('');

            // Attach hapus event
            document.querySelectorAll('.hapus-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const data = getPeminjaman();
                    const idx = parseInt(this.getAttribute('data-index'));
                    data.splice(idx, 1);
                    savePeminjaman(data);
                    renderTable();
                });
            });
        }

        // Handle form submit
        document.getElementById('pinjamForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const peminjaman = {
                nama: document.getElementById('nama').value.trim(),
                nomorAnggota: document.getElementById('nomorAnggota').value.trim(),
                judulBuku: document.getElementById('judulBuku').value.trim(),
                kategori: document.getElementById('kategori').value,
                tglPinjam: document.getElementById('tglPinjam').value,
                tglKembali: document.getElementById('tglKembali').value,
                catatan: document.getElementById('catatan').value.trim()
            };

            const data = getPeminjaman();
            data.push(peminjaman);
            savePeminjaman(data);
            renderTable();

            // Reset form
            this.reset();

            // Alert sukses
            alert('✅ Peminjaman berhasil diajukan!');
        });

        // Hapus semua
        document.getElementById('hapusSemuaBtn').addEventListener('click', function() {
            if (confirm('Hapus semua data peminjaman?')) {
                savePeminjaman([]);
                renderTable();
            }
        });

        // Render on load
        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>

</html>
