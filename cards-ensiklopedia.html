        <div class="position-relative overflow-hidden" style="height: 220px;">
            <img src="buku/ensklaxtek.avif" class="position-absolute w-100 h-100" style="object-fit: cover; filter: blur(20px); transform: scale(1.1);">

                <img src="buku/ensklaxtek.avif" style="height: 85%; object-fit: contain;">

            <div class="d-flex justify-content-between align-items-center">

            </div>
        </div>
    </div>
</div>
