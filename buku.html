<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet" />
    <title>Buku - LibraTech</title>
  </head>

  <body class="bg-light">
    <!-- Header -->
    <div class="bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4 shadow-sm">
      <div class="container">
        <h1 class="fw-bold display-5 mb-0 text-uppercase tracking-wide">LibraTech</h1>
      </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a href="index.html" class="navbar-brand p-0">
          <img src="logo.ico" alt="Logo" style="max-width: 45px; filter: brightness(0) invert(1)" />
        </a>
        <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-2">
            <li class="nav-item">
              <a class="nav-link active btn btn-warning text-dark fw-semibold px-3 rounded-pill" aria-current="page" href="buku.html">Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="pinjam.html">Pinjam</a>
            </li>
            <li class="nav-item" id="navLoginItem">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="login.html">Login</a>
            </li>
            <li class="nav-item" id="navRegisterItem">
              <a class="nav-link text-white fw-semibold px-3 rounded-pill nav-inactive" href="register.html">Daftar</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Judul -->
    <section class="bg-white py-4 border-bottom">
      <div class="container">
        <h2 class="fw-bold text-dark mb-0">📚 Koleksi Buku</h2>
        <p class="text-secondary mt-2 mb-0">Jelajahi koleksi buku kami</p>
      </div>
    </section>

    <!-- Thumbnail Row -->
    <section class="py-5">
      <div class="container">
        <div class="row g-3">
          <div class="col-6 col-lg-3">
            <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="komik" style="cursor: pointer">
              <img src="komik_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover" />
              <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5" style="background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent 50%)">
                Komik Aksi & Petualangan
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="novel" style="cursor: pointer">
              <img src="fiksiromantis_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover" />
              <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5" style="background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent 50%)">Novel</div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="ensiklopedia" style="cursor: pointer">
              <img src="fiksifantasi_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover" />
              <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5" style="background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent 50%)">
                Ensiklopedia
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="sejarah" style="cursor: pointer">
              <img src="fiksisejarah_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover" />
              <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5" style="background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent 50%)">
                Ilmu Sosial
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Book Grid -->
    <section class="bg-white py-5">
      <div class="container">
        <div class="row g-4" id="bookGrid">
          <!-- Cards will be loaded dynamically from localStorage -->
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // ===== DATA BUKU DEFAULT (jika localStorage kosong) =====
      const DEFAULT_BOOKS = [
        // Komik
        { kategori: "komik", judul: "Akasha : Chiruran Shinsengumi 13", penulis: "Eiji Hashimoto / Shinya Umemura", status: "Tersedia", badge: "Fiksi", gambar: "buku/chiruran.avif" },
        { kategori: "komik", judul: "Solo Leveling 17", penulis: "Dubu/Chugong", status: "Tersedia", badge: "Fiksi", gambar: "buku/sololeveling.avif" },
        { kategori: "komik", judul: "Level Comic: Jojo`s Bizarre Adventure 18 - Part 3 Stardust Crusaders", penulis: "Hirohiko Araki", status: "Dipinjam", badge: "Fiksi", gambar: "buku/jojo.avif" },
        { kategori: "komik", judul: "Naruto Bind Up Edition 26", penulis: "MASASHI KISHIMOTO", status: "Tersedia", badge: "Fiksi", gambar: "buku/naruto.avif" },
        { kategori: "komik", judul: "Level Comic: Dandadan 12", penulis: "Tatsu Yukinobu", status: "Tersedia", badge: "Fiksi", gambar: "buku/dandadan.avif" },
        { kategori: "komik", judul: "One Piece 110", penulis: "Eiichiro Oda", status: "Tersedia", badge: "Fiksi", gambar: "buku/onepiece.avif" },
        { kategori: "komik", judul: "Mashle 15", penulis: "Hajime Komoto", status: "Tersedia", badge: "Fiksi", gambar: "buku/masle.avif" },
        { kategori: "komik", judul: "Akasha : Neon Genesis Evangelion - Collector's Edition 03", penulis: "Yoshiyuki Sadamoto/khara/ Gainax", status: "Dipinjam", badge: "Fiksi", gambar: "buku/evangelion.avif" },
        // Novel
        { kategori: "novel", judul: "The Big Four", penulis: "Agatha Christie", status: "Tersedia", badge: "Fiksi", gambar: "buku/bigfour.avif" },
        { kategori: "novel", judul: "Milea: Suara dari Dilan", penulis: "Pidi Baiq", status: "Tersedia", badge: "Fiksi", gambar: "buku/milea.avif" },
        { kategori: "novel", judul: "Nadira", penulis: "Leila S. Chudori", status: "Tersedia", badge: "Fiksi", gambar: "buku/nadira.avif" },
        { kategori: "novel", judul: "Hafalan Solat Delisa", penulis: "Tere Liye", status: "Tersedia", badge: "Non-Fiksi", gambar: "buku/hafalansolat.avif" },
        // Ensiklopedia
        { kategori: "ensiklopedia", judul: "National Geographic : Aztek Kuno", penulis: "Tim Cooke", status: "Tersedia", badge: "Non-Fiksi", gambar: "buku/ensklaxtek.avif" },
        { kategori: "ensiklopedia", judul: "National Geographic: Mesir Kuno", penulis: "Jill Rubalcaba", status: "Tersedia", badge: "Non-Fiksi", gambar: "buku/ensklmesur.avif" },
        { kategori: "ensiklopedia", judul: "Ensiklopedia Junior : Mobil", penulis: "Fleurus", status: "Tersedia", badge: "Non-Fiksi", gambar: "buku/ensklmobil.avif" },
        { kategori: "ensiklopedia", judul: "National Geographic : Romawi Kuno", penulis: "Zilah Deckker", status: "Tersedia", badge: "Non-Fiksi", gambar: "buku/ensklyunani.avif" },
        // Sejarah
        { kategori: "sejarah", judul: "Statistika Penelitian", penulis: "Mumun Syaban Elly Ratnaningrun", status: "Tersedia", badge: "Ilmu Sosial", gambar: "buku/statistika.jpg" },
        { kategori: "sejarah", judul: "Jokowi Dari Rakyat Dan Tetap Merakyat", penulis: "West Angga Tijany", status: "Tersedia", badge: "Ilmu Sosial", gambar: "buku/jkwi.jpg" },
        { kategori: "sejarah", judul: "Sejarah Dunia Abad Pertengahan", penulis: "Susan Wise Bauer", status: "Tersedia", badge: "Ilmu Sosial", gambar: "buku/nalar.png" },
        { kategori: "sejarah", judul: "HTML 5 dan Java Script untuk Pemula", penulis: "Jubilee Enterprise", status: "Tersedia", badge: "Ilmu Sosial", gambar: "buku/sjrhroma.avif" },
      ];

      // Inisialisasi data buku di localStorage jika kosong
      function initBooks() {
        const existing = localStorage.getItem("libraTechBooks");
        if (!existing || JSON.parse(existing).length === 0) {
          localStorage.setItem("libraTechBooks", JSON.stringify(DEFAULT_BOOKS));
        }
      }

      function getBooks() {
        return JSON.parse(localStorage.getItem("libraTechBooks")) || [];
      }

      // Warna badge berdasarkan label
      function getBadgeClass(badge) {
        const map = {
          Fiksi: "bg-warning text-dark",
          "Non-Fiksi": "bg-info text-white",
          "Ilmu Sosial": "bg-secondary text-white",
        };
        return map[badge] || "bg-secondary text-white";
      }

      // Warna status
      function getStatusClass(status) {
        return status === "Tersedia" ? "text-success" : "text-danger";
      }

      let currentCategory = "komik";

      // Load cards for a given category
      function loadCards(category) {
        const books = getBooks();
        const filtered = books.filter((b) => b.kategori === category);
        const grid = document.getElementById("bookGrid");

        if (filtered.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center text-secondary py-5"><h5>Tidak ada buku di kategori ini</h5></div>';
          return;
        }

        grid.innerHTML = filtered
          .map(
            (book) => `
                <div class="col-sm-6 col-md-4 col-lg-3 book-item" data-category="${book.kategori}">
                    <div class="card border-0 shadow-sm h-100 rounded-4 overflow-hidden">
                        <div class="position-relative overflow-hidden" style="height: 220px;">
                            <img src="${book.gambar}" class="position-absolute w-100 h-100" style="object-fit: cover; filter: blur(20px); transform: scale(1.1);">
                            <div class="position-relative w-100 h-100 d-flex align-items-center justify-content-center">
                                <img src="${book.gambar}" style="height: 85%; object-fit: contain;">
                            </div>
                        </div>
                        <div class="card-body">
                            <span class="badge ${getBadgeClass(book.badge)} mb-2">${book.badge}</span>
                            <h5 class="card-title fw-bold">${book.judul}</h5>
                            <p class="card-text text-secondary small">${book.penulis}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold ${getStatusClass(book.status)}">${book.status}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `
          )
          .join("");

        currentCategory = category;
      }

      document.addEventListener("DOMContentLoaded", function () {
        // Inisialisasi data buku default jika belum ada
        initBooks();

        // Load default category
        loadCards("komik");

        // Setup thumbnail click handlers
        const thumbnails = document.querySelectorAll(".thumbnail-btn");
        thumbnails.forEach(function (thumb) {
          thumb.addEventListener("click", function () {
            const category = this.getAttribute("data-category");
            loadCards(category);
          });
        });
      });
    </script>
  </body>
</html>
