<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <title>Buku - LibraTech</title>
</head>

<body class="bg-light">

    <!-- Header -->
    <div class="bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4 shadow-sm">
        <div class="container">
            <h1 class="fw-bold display-5 mb-0 text-uppercase tracking-wide">LibraTech</h1>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand p-0">
                <img src="logo.ico" alt="Logo" style="max-width: 45px; filter: brightness(0) invert(1);">
            </a>
            <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link active btn btn-warning text-dark fw-semibold px-3 rounded-pill"
                            aria-current="page" href="buku.html">Buku</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold px-3 rounded-pill" href="#">Pinjam</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold px-3 rounded-pill" href="#">Pricing</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Judul -->
    <section class="bg-white py-4 border-bottom">
        <div class="container">
            <h2 class="fw-bold text-dark mb-0">📚 Koleksi Buku</h2>
            <p class="text-secondary mt-2 mb-0">Jelajahi ribuan koleksi buku digital kami</p>
        </div>
    </section>

    <!-- Thumbnail Row -->
    <section class="py-5">
        <div class="container">
            <div class="row g-3">
                <div class="col-6 col-lg-3">
                    <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="komik" style="cursor: pointer;">
                        <img src="komik_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover;">
                        <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5"
                            style="background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);">Komik Aksi & Petualangan</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="novel" style="cursor: pointer;">
                        <img src="fiksiromantis_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover;">
                        <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5"
                            style="background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);">Novel</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="ensiklopedia" style="cursor: pointer;">
                        <img src="fiksifantasi_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover;">
                        <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5"
                            style="background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);">Ensiklopedia</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="position-relative rounded-4 overflow-hidden shadow-sm thumbnail-btn" data-category="sejarah" style="cursor: pointer;">
                        <img src="fiksisejarah_thumbnail.avif" class="w-100" style="aspect-ratio: 2 / 1; object-fit: cover;">
                        <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-white fw-bold fs-5"
                            style="background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 50%);">Sejarah</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Book Grid -->
    <section class="bg-white py-5">
        <div class="container">
            <div class="row g-4" id="bookGrid">
                <!-- Cards will be loaded dynamically -->
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Map category to card file
        const cardFiles = {
            komik: 'cards-komik.html',
            novel: 'cards-novel.html',
            ensiklopedia: 'cards-ensiklopedia.html',
            sejarah: 'cards-sejarah.html'
        };

        let currentCategory = 'komik';

        // Load cards for a given category
        function loadCards(category) {
            const file = cardFiles[category];
            if (!file) return;

            fetch(file)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('bookGrid').innerHTML = html;
                    currentCategory = category;
                })
                .catch(err => console.error('Error loading cards:', err));
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Load default category
            loadCards('komik');

            // Setup thumbnail click handlers
            const thumbnails = document.querySelectorAll('.thumbnail-btn');
            thumbnails.forEach(function(thumb) {
                thumb.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    loadCards(category);
                });
            });
        });
    </script>
</body>

</html>
